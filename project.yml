# Source of truth for the Xcode project. Regenerate with:  xcodegen generate
name: Prelez
options:
  bundleIdPrefix: cz.utb.ap9pt
  # Czech UI: system strings (Search, Cancel…) follow the development language.
  developmentLanguage: cs
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Prelez:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Prelez
        type: syncedFolder
    settings:
      base:
        PRODUCT_NAME: Prelez
        PRODUCT_BUNDLE_IDENTIFIER: cz.utb.ap9pt.prelez
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Přelez
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readonly
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
  PrelezTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: PrelezTests
        type: syncedFolder
    dependencies:
      - target: Prelez
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.utb.ap9pt.prelez.tests
        GENERATE_INFOPLIST_FILE: YES
        # Multiplatform host: the executable sits in Contents/MacOS on macOS, at the bundle root on iOS.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Prelez.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Prelez"
        BUNDLE_LOADER: "$(TEST_HOST)"
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
schemes:
  Prelez:
    build:
      targets:
        Prelez: all
        PrelezTests: [test]
    test:
      config: Debug
      targets:
        - PrelezTests
    run:
      config: Debug
